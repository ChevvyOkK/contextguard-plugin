name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No package.json / dependencies here by design (see README) — Node's
      # own built-in test runner over the suite is the entire test command.
      - run: node --test tests/*.test.js
